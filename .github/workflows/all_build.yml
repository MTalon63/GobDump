            - name: Add support to NSIS for long PATHs
              shell: powershell
              run: ${{github.workspace}}\windows\Get-NSIS-LongStrings.ps1

            - name: Create Build Environment
              run: cmake -E make_directory ${{runner.workspace}}/build

            - name: Install sccache
              shell: powershell
              run: |
                  $version = "v0.8.2"
                  $asset = "sccache-$version-x86_64-pc-windows-msvc"
                  Invoke-WebRequest -Uri "https://github.com/mozilla/sccache/releases/download/$version/$asset.zip" -OutFile "$env:TEMP\sccache.zip"
                  Expand-Archive -Path "$env:TEMP\sccache.zip" -DestinationPath "$env:TEMP\sccache" -Force
                  echo "$env:TEMP\sccache\$asset" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8

            - name: Cache sccache
              uses: actions/cache@v4
              with:
                  path: ${{ runner.temp }}/sccache-cache
                  key: win-sccache-arm64-${{ github.sha }}
                  restore-keys: win-sccache-arm64-

            - name: Configure CMake
              working-directory: ${{runner.workspace}}/build
              run: cmake -A ARM64 -DVCPKG_TARGET_TRIPLET="arm64-windows" -DVCPKG_HOST_TRIPLET="x64-windows" -DVCPKG_USE_HOST_TOOLS=ON -DCMAKE_SYSTEM_VERSION="10.0.22621.0" -DCMAKE_SYSTEM_NAME=Windows -DCMAKE_SYSTEM_PROCESSOR=ARM64 -DCMAKE_CROSSCOMPILING=ON -DPLUGIN_LIMESDR_SDR_SUPPORT=OFF -DBUILD_MSVC=ON -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DCMAKE_TOOLCHAIN_FILE="${{github.workspace}}\vcpkg\scripts\buildsystems\vcpkg.cmake" "$Env:GITHUB_WORKSPACE"

            - name: Build
              working-directory: ${{runner.workspace}}/build
              shell: bash
              run: cmake --build . --config $BUILD_TYPE

            - name: Build Installer
              working-directory: ${{runner.workspace}}/build
              shell: bash
              run: cpack -C $BUILD_TYPE

            - name: Upload Installer
              uses: actions/upload-artifact@v4
              with:
                  name: GobDump-Windows_arm64_Installer
                  path: ${{runner.workspace}}/build/GobDump-*.exe

            - name: Add dumpbin to PATH
              run: echo "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC\$((Get-ChildItem -Path "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC" | Sort-Object Name -Descending | Select-Object -First 1).Name)\bin\Hostx64\x64" >> $env:GITHUB_PATH

            - name: Build Portable
