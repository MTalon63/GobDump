    build_macos_intel:
        runs-on: macos-15-intel

        env:
            CCACHE_DIR: ${{ github.workspace }}/.ccache
            CCACHE_MAXSIZE: 4G

        steps:
            - uses: actions/checkout@v4

            - name: Select Xcode version
              run: sudo xcode-select -s '/Applications/Xcode_16.2.app/Contents/Developer'

            - name: Install brew dependencies
              # These are preinstalled in the GitHub runners, cause needless warnings to appear
              # Add these back if these ever become missing for some reason
              # sqlite3 libtool autoconf libjpeg-turbo libtiff libusb libpng zstd
              run: brew install ccache ninja dylibbundler automake meson orc libxml2 zlib portaudio boost nng volk libomp glfw3 fftw libxml2 portaudio jemalloc nng armadillo hdf5 protobuf grpc

            - name: Create Build Environment
              # Some projects don't allow in-source building, so create a separate build directory
              # We'll use this as our working directory for all subsequent commands
              run: cmake -E make_directory ${{runner.workspace}}/build

            - name: Cache dependencies
              uses: actions/cache@v4
              id: macos-deps-intel
              with:
                  path: deps
                  key: macos-deps-intel-${{ hashFiles('macOS/build_deps.sh') }}

            - name: Build dependencies
              if: steps.macos-deps-intel.outputs.cache-hit != 'true'
              working-directory: ${{runner.workspace}}/build
              shell: bash
              run: $GITHUB_WORKSPACE/macOS/build_deps.sh

            - name: Cache compiler objects
              uses: actions/cache@v4
              with:
                  path: .ccache
                  key: macos-ccache-intel-${{ github.sha }}
                  restore-keys: macos-ccache-intel-

            - name: Configure CMake
              working-directory: ${{runner.workspace}}/build
              # Note the current convention is to use the -S and -B options here to specify source
              # and build directories, but this is only available with CMake 3.13 and higher.
              # The CMake binaries on the Github Actions machines are (as of this writing) 3.12
              run: cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DBUNDLING_MODE=ON -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -G Ninja

            - name: Build
              working-directory: ${{runner.workspace}}/build
              shell: bash
              run: ninja

            - name: Bundle
              working-directory: ${{runner.workspace}}/build
              shell: bash
              #env:
              #  MACOS_TEAM: ${{ secrets.MACOS_TEAM }}
              #  MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
              #  MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
              #  MACOS_SIGNING_SIGNATURE: ${{ secrets.MACOS_SIGNING_SIGNATURE }}
              #  MACOS_NOTARIZATION_UN: ${{ secrets.MACOS_NOTARIZATION_UN }}
              #  MACOS_NOTARIZATION_PWD: ${{ secrets.MACOS_NOTARIZATION_PWD }}
              run: $GITHUB_WORKSPACE/macOS/bundle.sh

            - name: Upload DMG
              uses: actions/upload-artifact@v4
              with:
                  name: GobDump-macOS-Intel
                  path: ${{runner.workspace}}/build/*.dmg

    build_macos_silicon:
        runs-on: macos-15

        env:
            CCACHE_DIR: ${{ github.workspace }}/.ccache
            CCACHE_MAXSIZE: 4G

        steps:
            - uses: actions/checkout@v4

            - name: Select Xcode version
              run: sudo xcode-select -s '/Applications/Xcode_16.2.app/Contents/Developer'

            - name: Install brew dependencies
              # These are preinstalled in the GitHub runners, cause needless warnings to appear
              # Add these back if these ever become missing for some reason
              run: brew install ccache ninja dylibbundler libtool autoconf automake meson orc libxml2 zlib portaudio boost nng volk libomp glfw3 fftw libxml2 portaudio jemalloc nng armadillo hdf5 protobuf grpc

            - name: Create Build Environment
              # Some projects don't allow in-source building, so create a separate build directory
              # We'll use this as our working directory for all subsequent commands
              run: cmake -E make_directory ${{runner.workspace}}/build

            - name: Cache dependencies
              uses: actions/cache@v4
              id: macos-deps-silicon
              with:
                  path: deps
                  key: macos-deps-silicon-${{ hashFiles('macOS/build_deps.sh') }}

            - name: Build dependencies
              if: steps.macos-deps-silicon.outputs.cache-hit != 'true'
              working-directory: ${{runner.workspace}}/build
              shell: bash
              run: $GITHUB_WORKSPACE/macOS/build_deps.sh

            - name: Cache compiler objects
              uses: actions/cache@v4
              with:
                  path: .ccache
                  key: macos-ccache-silicon-${{ github.sha }}
                  restore-keys: macos-ccache-silicon-

            - name: Configure CMake
              working-directory: ${{runner.workspace}}/build
              # Note the current convention is to use the -S and -B options here to specify source
              # and build directories, but this is only available with CMake 3.13 and higher.
              # The CMake binaries on the Github Actions machines are (as of this writing) 3.12
              run: cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DBUNDLING_MODE=ON -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -G Ninja

            - name: Build
              working-directory: ${{runner.workspace}}/build
              shell: bash
              run: ninja

            - name: Bundle
              working-directory: ${{runner.workspace}}/build
              shell: bash
              #env:
              #  MACOS_TEAM: ${{ secrets.MACOS_TEAM }}
              #  MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
              #  MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
              #  MACOS_SIGNING_SIGNATURE: ${{ secrets.MACOS_SIGNING_SIGNATURE }}
              #  MACOS_NOTARIZATION_UN: ${{ secrets.MACOS_NOTARIZATION_UN }}
              #  MACOS_NOTARIZATION_PWD: ${{ secrets.MACOS_NOTARIZATION_PWD }}
              run: $GITHUB_WORKSPACE/macOS/bundle.sh

            - name: Upload DMG
              uses: actions/upload-artifact@v4
              with:
                  name: GobDump-macOS-Silicon
                  path: ${{runner.workspace}}/build/*.dmg

    # Yes, since I was asked to do like SDR++ for this I did look at how Ryzerth has done it :-)
    update_nightly_release:
        needs: ["build_windows_msys2", "build_windows_x64", "build_windows_arm64", "build_ubuntu_2204", "build_ubuntu_2404", "build_macos_intel", "build_macos_silicon", "build_linux_arm64", "build_android"]
        runs-on: ubuntu-latest
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}

        steps:
            - name: Download Artifacts
              uses: actions/download-artifact@v4

            - name: Install zip
              run: sudo apt install -y unzip

            - name: Copy files
              run: mkdir gobdump_out && cp GobDump-Ubuntu-22.04/gobdump*.deb gobdump_out/gobdump_ubuntu_22.04_amd64.deb && cp GobDump-Ubuntu-24.04/gobdump*.deb gobdump_out/gobdump_ubuntu_24.04_amd64.deb && cp GobDump-macOS-Intel/GobDump-macOS-Intel.dmg gobdump_out/GobDump-macOS-Intel.dmg && cp GobDump-macOS-Silicon/GobDump-macOS-Silicon.dmg gobdump_out/GobDump-macOS-Silicon.dmg && (cd GobDump-Windows_x64_Portable && zip -r ../gobdump_out/GobDump-Windows_x64_Portable.zip *) && cp GobDump-Windows_x64_Installer/GobDump-*.exe gobdump_out/GobDump-Windows_x64_Installer.exe && cp GobDump-Pi64-Latest/gobdump*.deb gobdump_out/gobdump_rpi64_latest_arm64.deb && (cd GobDump-Windows_arm64_Portable && zip -r ../gobdump_out/GobDump-Windows_arm64_Portable.zip *) && cp GobDump-Windows_arm64_Installer/GobDump-*.exe gobdump_out/GobDump-Windows_arm64_Installer.exe && cp GobDump-release.apk/app-release-signed.apk gobdump_out/GobDump-Android.apk && cp GobDump-AppImage/*.AppImage gobdump_out/GobDump.AppImage

            - name: Update Nightly
              run: gh release upload nightly gobdump_out/* -R ${{github.repository}} --clobber
