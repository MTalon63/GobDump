            # scripts/ and triplets/) alongside installed/, since on cache hits
            # Configure-vcpkg.ps1 is skipped and vcpkg is never cloned. Without
            # the marker the toolchain fails with "Could not find .vcpkg-root".
            - name: Cache dependencies
              uses: actions/cache@v4
              id: win-deps-arm64
              with:
                  path: |
                      vcpkg/installed
