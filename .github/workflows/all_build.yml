name: Build All

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
    BUILD_TYPE: Release
    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
    contents: write

jobs:
    build_windows_msys2:
        runs-on: windows-2022

        defaults:
            run:
                shell: msys2 {0}

        env:
            GOBDUMP_DEPS_STAGE: msys2-deps
            CCACHE_DIR: ${{ github.workspace }}/.ccache
            CCACHE_MAXSIZE: 4G

        steps:
            - uses: actions/checkout@v4

            - name: Set up MSYS2 UCRT64
              uses: msys2/setup-msys2@v2
              with:
                  msystem: UCRT64
                  update: true
                  install: base-devel git
                  pacboy: ccache:p
                  # setup-msys2 caches the pacman packages itself.
                  cache: true

            # cpu_features/airspy/airspyhf/bladeRF are built from source, which
            # dominates setup time. Everything else comes from pacman.
            - name: Cache source-built dependencies
              uses: actions/cache@v4
              id: msys2-deps
              with:
                  path: msys2-deps
                  key: msys2-deps-ucrt64-${{ hashFiles('windows/Setup-MSYS2.sh') }}

            - name: Install dependencies
              run: ./windows/Setup-MSYS2.sh

            - name: Cache compiler objects
              uses: actions/cache@v4
              with:
                  path: .ccache
                  key: msys2-ccache-ucrt64-${{ github.sha }}
                  restore-keys: msys2-ccache-ucrt64-

            - name: Configure CMake
              run: |
                  cmake -S . -B build -G Ninja \
                      -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
                      -DPLUGINS_ALL=ON \
                      -DBUILD_TESTING=OFF \
                      -DCMAKE_C_COMPILER_LAUNCHER=ccache \
                      -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

            - name: Build
              run: cmake --build build --parallel

            - name: ccache statistics
              run: ccache --show-stats

            - name: Package portable
              run: |
                  cmake --install build --prefix install
                  cp -r resources pipelines install/ 2>/dev/null || true

            - name: Upload Portable
              uses: actions/upload-artifact@v4
              with:
                  name: GobDump-Windows_MSYS2_UCRT64_Portable
                  path: install

    build_windows_x64:
        runs-on: windows-2022

        env:
            SCCACHE_CACHE_SIZE: 4G
            SCCACHE_DIR: D:\a\_temp\sccache-cache

        steps:
            - uses: actions/checkout@v4

            # Cache the vcpkg tree metadata (including the .vcpkg-root marker,
            # scripts/ and triplets/) alongside installed/, since on cache hits
            # Configure-vcpkg.ps1 is skipped and vcpkg is never cloned. Without
            # the marker the toolchain fails with "Could not find .vcpkg-root".
            - name: Cache dependencies
              uses: actions/cache@v4
              id: win-deps-x64
              with:
                  path: |
                      vcpkg/installed
                      vcpkg/scripts
                      vcpkg/triplets
                      vcpkg/triplets_community
                      vcpkg/.vcpkg-root
                  key: win-deps-x64-v2-${{ hashFiles('windows/Configure-vcpkg.ps1') }}

            - name: Set up Python 3.13
              if: steps.win-deps-x64.outputs.cache-hit != 'true'
              uses: actions/setup-python@v5
              with:
                  python-version: 3.13

            - name: Install mako
              if: steps.win-deps-x64.outputs.cache-hit != 'true'
              run: pip install mako

            - name: Add msbuild to PATH
              if: steps.win-deps-x64.outputs.cache-hit != 'true'
              uses: microsoft/setup-msbuild@v2

            - name: Configure vcpkg
              if: steps.win-deps-x64.outputs.cache-hit != 'true'
              shell: powershell
              run: ${{github.workspace}}\windows\Configure-vcpkg.ps1 -platform x64-windows

            - name: Clean up vcpkg
              if: steps.win-deps-x64.outputs.cache-hit != 'true'
              run: rm -recurse -force $Env:GITHUB_WORKSPACE/vcpkg/packages, $Env:GITHUB_WORKSPACE/vcpkg/downloads, $Env:GITHUB_WORKSPACE/vcpkg/buildtrees

# I FUCKING HATE AARONIA
#            - name: Download Aaronia RTSA API
#              if: steps.win-deps-x64.outputs.cache-hit != 'true'
#              shell: powershell
#              run: Invoke-WebRequest -Uri "https://www.satdump.org/Aaronia_RTSA_Suite_PRO_2.2.0.12821_Setup_64bit.exe" -OutFile $Env:GITHUB_WORKSPACE/vcpkg/rtsa.exe
#
#            - name: Install Aaronia RTSA API
#              shell: cmd
#              run: start /wait vcpkg\rtsa.exe /q2 /install

            - name: Add support to NSIS for long PATHs
              shell: powershell
              run: ${{github.workspace}}\windows\Get-NSIS-LongStrings.ps1

            - name: Create Build Environment
              run: cmake -E make_directory ${{runner.workspace}}/build

            - name: Install sccache
              shell: powershell
              run: |
                  $version = "v0.8.2"
                  $asset = "sccache-$version-x86_64-pc-windows-msvc"
                  Invoke-WebRequest -Uri "https://github.com/mozilla/sccache/releases/download/$version/$asset.zip" -OutFile "$env:TEMP\sccache.zip"
                  Expand-Archive -Path "$env:TEMP\sccache.zip" -DestinationPath "$env:TEMP\sccache" -Force
                  echo "$env:TEMP\sccache\$asset" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8

            - name: Cache sccache
              uses: actions/cache@v4
              with:
                  path: ${{ runner.temp }}/sccache-cache
                  key: win-sccache-x64-${{ github.sha }}
                  restore-keys: win-sccache-x64-

            - name: Configure CMake
              working-directory: ${{runner.workspace}}/build
              run: cmake -DVCPKG_TARGET_TRIPLET="x64-windows" -DPLUGIN_AARONIA_SDR_SUPPORT=ON -DBUILD_MSVC=ON -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DCMAKE_TOOLCHAIN_FILE="${{github.workspace}}\vcpkg\scripts\buildsystems\vcpkg.cmake" "$Env:GITHUB_WORKSPACE"

            - name: Build
              working-directory: ${{runner.workspace}}/build
              shell: bash
              run: cmake --build . --config $BUILD_TYPE

            - name: Build Installer
              working-directory: ${{runner.workspace}}/build
              shell: bash
              run: cpack -C $BUILD_TYPE

            - name: Upload Installer
              uses: actions/upload-artifact@v4
              with:
                  name: GobDump-Windows_x64_Installer
                  path: ${{runner.workspace}}/build/GobDump-*.exe

            - name: Add dumpbin to PATH
              run: echo "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC\$((Get-ChildItem -Path "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC" | Sort-Object Name -Descending | Select-Object -First 1).Name)\bin\Hostx64\x64" >> $env:GITHUB_PATH

            - name: Build Portable
              shell: powershell
              run: ${{github.workspace}}\windows\Finish-Release.ps1 -platform x64-windows -BuildPath ${{runner.workspace}}\build

            - name: Upload Portable
              uses: actions/upload-artifact@v4
              with:
                  name: GobDump-Windows_x64_Portable
                  path: ${{runner.workspace}}/build/Release/*

