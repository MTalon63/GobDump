                  path: ${{runner.workspace}}/build/Release/*

    build_android:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: true

            - name: Set up JDK
              uses: actions/setup-java@v5
              with:
                java-version: "17"
                distribution: "temurin"

            - name: Set up Android SDK
              uses: android-actions/setup-android@v3

            - name: Install NDK, platform, and CMake
              shell: bash
              run: |
                  sdkmanager --install "ndk;25.2.9519653" "platforms;android-34" "cmake;3.22.1"

            - name: Cache dependencies
              uses: actions/cache@v4
              id: android-deps
              with:
                  path: android/deps/output
                  key: android-deps-v3-${{ hashFiles('android/deps/build.sh') }}

            - name: Install dependency build tools
              if: steps.android-deps.outputs.cache-hit != 'true'
              run: sudo apt-get install -y python3-mako

            - name: Build dependencies
              if: steps.android-deps.outputs.cache-hit != 'true'
              shell: bash
              run: cd $GITHUB_WORKSPACE/android/deps && sh build.sh

            - name: Generate Gradle wrapper
              uses: gradle/actions/setup-gradle@v4
              with:
                  gradle-version: 8.10.2

            - name: Build
              shell: bash
              run: |
                  # Generate the wrapper in a clean dir to avoid evaluating the project's AGP
                  # Gradle 8.10.2 requires a settings file to exist before running 'gradle wrapper'
                  mkdir -p /tmp/gradle-wrapper && cd /tmp/gradle-wrapper
                  echo "" > settings.gradle
                  gradle wrapper --gradle-version 8.10.2 --distribution-type bin
                  cp -r gradlew gradlew.bat gradle $GITHUB_WORKSPACE/android/
                  cd $GITHUB_WORKSPACE/android
                  ./gradlew assembleRelease

            - name: Sign APK
              shell: bash
              run: |
                  APK=$GITHUB_WORKSPACE/android/app/build/outputs/apk/release/app-release-unsigned.apk
                  SIGNED=$GITHUB_WORKSPACE/android/app/build/outputs/apk/release/app-release-signed.apk
                  echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.keystore
                  $ANDROID_HOME/build-tools/30.0.3/apksigner sign \
                      --ks /tmp/release.keystore \
                      --ks-key-alias ${{ secrets.ANDROID_KEY_ALIAS }} \
                      --ks-pass pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
                      --key-pass pass:${{ secrets.ANDROID_KEY_PASSWORD }} \
                      --out $SIGNED \
                      $APK

            - name: Upload APK
              uses: actions/upload-artifact@v4
              with:
                  name: GobDump-release.apk
                  path: ${{github.workspace}}/android/app/build/outputs/apk/release/app-release-signed.apk

    build_ubuntu_2204:
        # The CMake configure and build commands are platform agnostic and should work equally
        # well on Windows or Mac.  You can convert this to a matrix build if you need
        # cross-platform coverage.
        # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
        runs-on: ubuntu-22.04

        steps:
            - uses: actions/checkout@v4

            - name: Update repositories
              run: sudo apt update

            - name: Install dependencies
              run: sudo apt install -y libdbus-1-dev libcurl4-openssl-dev libglfw3-dev libfftw3-dev libvolk2-dev build-essential cmake pkgconf libjpeg-dev libpng-dev libtiff-dev libairspy-dev libairspyhf-dev libhackrf-dev librtlsdr-dev libomp-dev libnng-dev libiio-dev libzstd-dev libad9361-dev libbladerf-dev libuhd-dev liblimesuite-dev ocl-icd-opencl-dev libjemalloc-dev portaudio19-dev libhdf5-dev ninja-build

            - name: Create Build Environment
              # Some projects don't allow in-source building, so create a separate build directory
              # We'll use this as our working directory for all subsequent commands
              run: cmake -E make_directory ${{runner.workspace}}/build

            - name: Configure CMake
              # Use a bash shell so we can use the same syntax for environment variable
              # access regardless of the host operating system
              shell: bash
              working-directory: ${{runner.workspace}}/build
              # Note the current convention is to use the -S and -B options here to specify source
              # and build directories, but this is only available with CMake 3.13 and higher.
              # The CMake binaries on the Github Actions machines are (as of this writing) 3.12
              run: cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DCMAKE_INSTALL_PREFIX=/usr -G Ninja

            - name: Build
              working-directory: ${{runner.workspace}}/build
              shell: bash
              run: ninja

            - name: Package
              working-directory: ${{runner.workspace}}/build
              shell: bash
              run: ninja package

            - name: Upload ZIP
              uses: actions/upload-artifact@v4
              with:
                  name: GobDump-Ubuntu-22.04
                  path: ${{runner.workspace}}/build/*.deb

            # AppImage packaging (folded back in from upstream/master)
            - name: Setup pkg2appimage
              working-directory: ${{runner.workspace}}/build
              shell: bash
              # Execute the build.  You can specify a specific target with "--target <NAME>"
              run:  wget https://raw.githubusercontent.com/probonopd/AppImages/master/pkg2appimage && chmod +x pkg2appimage && sudo apt install -y imagemagick desktop-file-utils libfuse2

            - name: Make AppImage
              working-directory: ${{runner.workspace}}/build
              shell: bash
              # Execute the build.  You can specify a specific target with "--target <NAME>"
              run: cp *.deb /tmp/gobdump.deb && cp $GITHUB_WORKSPACE/SatDump.yml . && ./pkg2appimage SatDump.yml

            - name: Upload AppImage
              uses: actions/upload-artifact@v4
              with:
                  name: GobDump-AppImage
                  path: ${{runner.workspace}}/build/out/*.AppImage

