# pkg2appimage requires 2-space YAML nesting.
app: GobDump
binpatch: false

ingredients:
  debs:
    - /tmp/gobdump.deb
  packages:
    - libfftw3-3
    - libfftw3-single3
    - libsqlite3-0
    - libcurl4
    - libdbus-1-3
    - libportaudio2
    - libusb-1.0-0
    - libgomp1
    - ocl-icd-libopencl1
    - libiio0
    - libad9361-0
    - libmbedtls14
    - libmbedx509-1
    - libmbedcrypto7
    - librtmp1
    - libldap-2.5-0
    - libssh-4
    - libsasl2-2
    - libsasl2-modules-db
    - libgnutls30
    - libgmp10
    - libhogweed6
    - libnettle8
    - libidn2-0
    - libunistring2
    - libp11-kit0
    - libtasn1-6
    - libffi8
    - libgssapi-krb5-2
    - libkrb5-3
    - libkrb5support0
    - libk5crypto3
    - libcom-err2
    - libkeyutils1
    - libdb5.3
    - libbrotli1
    - libnghttp2-14
    - libpsl5
    - libssl3
    - libjbig0
    - libvolk2.5
    - libpng16-16
    - libnng1
    - librtlsdr0
    - libhackrf0
    - libairspy0
    - libairspyhf1
    - libwayland-client0
    - libwayland-cursor0
    - libwayland-egl1
    - libxkbcommon0
    - libx11-6
    - libxrandr2
    - libxinerama1
    - libxcursor1
    - libxi6
    - libxext6
    - libzstd1
    - libjemalloc2
    - libtiff5
    - libuhd4.1.0
    - liblimesuite20.10-1
    - libbladerf2
    - libhdf5-103-1
    - libhdf5-hl-100
    - zenity
  exclude:
    # GLFW and graphics/EGL/GLVND are host/CI supplied.
    - libglfw3
    - libglfw3-wayland
    - libegl1
    - libopengl0
    - libglvnd0
    - libglx0
    - libgl1
    - python3
    - libpython3.10-minimal
    - libpython3.10-stdlib
  sources:
    - deb http://archive.ubuntu.com/ubuntu/ jammy main universe
  dist:
    - jammy
  script:
    - echo 1.2.1 > VERSION

# Runs after .deb extraction.
script:
  - cp -av /opt/glfw34/lib/libglfw.so.3* usr/lib/x86_64-linux-gnu/
